name: Feature request
description: Ask for a Fluxbox behaviour fluxwl lacks, or something new.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: For a Fluxbox behaviour, say what Fluxbox does, ideally with the resource or key binding involved.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you
